name: Cloudflare configuration audit

on:
  push:
    branches:
      - audit/cloudflare-config-20260814

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify configured Cloudflare authority without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account_id = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          print('CLOUDFLARE_API_TOKEN_PRESENT=' + ('yes' if token else 'no'))
          print('CLOUDFLARE_ACCOUNT_ID_PRESENT=' + ('yes' if account_id else 'no'))
          if not token or not account_id:
              raise SystemExit(10)

          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'PulseRail-Cloudflare-Audit/2',
          }

          def get(label, path):
              req = urllib.request.Request('https://api.cloudflare.com/client/v4' + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      body = json.load(r)
                      status = r.status
              except urllib.error.HTTPError as e:
                  status = e.code
                  try:
                      body = json.load(e)
                  except Exception:
                      body = {'success': False, 'errors': [{'code': e.code, 'message': 'non-json http error'}]}
              print(label + '_HTTP_STATUS=' + str(status))
              print(label + '_SUCCESS=' + ('yes' if body.get('success') is True else 'no'))
              errors = body.get('errors') or []
              if errors:
                  safe = []
                  for item in errors[:3]:
                      if isinstance(item, dict):
                          safe.append(str(item.get('code')) + ':' + str(item.get('message')))
                  if safe:
                      print(label + '_ERRORS=' + ' | '.join(safe))
              return status, body

          status, data = get('TOKEN_VERIFY', '/user/tokens/verify')
          token_status = (data.get('result') or {}).get('status')
          if token_status:
              print('CLOUDFLARE_API_TOKEN_STATUS=' + str(token_status))
          active = status == 200 and data.get('success') is True and token_status == 'active'
          print('CLOUDFLARE_API_TOKEN_ACTIVE=' + ('yes' if active else 'no'))

          status, data = get('ACCOUNT', '/accounts/' + urllib.parse.quote(account_id, safe=''))
          account_ok = status == 200 and data.get('success') is True
          print('CLOUDFLARE_ACCOUNT_ACCESSIBLE=' + ('yes' if account_ok else 'no'))
          if account_ok:
              result = data.get('result') or {}
              name = result.get('name')
              if isinstance(name, str) and name:
                  print('CLOUDFLARE_ACCOUNT_NAME=' + name)

          status, data = get('WORKERS_LIST', '/accounts/' + urllib.parse.quote(account_id, safe='') + '/workers/scripts')
          scripts_ok = status == 200 and data.get('success') is True
          worker_found = False
          if scripts_ok:
              for item in data.get('result') or []:
                  if isinstance(item, dict) and item.get('id') == 'regulated-infinity-web':
                      worker_found = True
                      break
          print('REGULATED_INFINITY_WEB_WORKER_PRESENT=' + ('yes' if worker_found else 'no'))

          status, data = get('WORKER_DOMAINS', '/accounts/' + urllib.parse.quote(account_id, safe='') + '/workers/domains')
          domains_ok = status == 200 and data.get('success') is True
          domain_found = False
          if domains_ok:
              for item in data.get('result') or []:
                  if not isinstance(item, dict):
                      continue
                  if item.get('hostname') == 'regulatedinfinity.com' and item.get('service') == 'regulated-infinity-web':
                      domain_found = True
                      print('REGULATEDINFINITY_DOMAIN_ZONE=' + str(item.get('zone_name') or 'unknown'))
                      break
          print('REGULATEDINFINITY_CUSTOM_DOMAIN_PRESENT=' + ('yes' if domain_found else 'no'))

          status, data = get('WORKER_SUBDOMAIN', '/accounts/' + urllib.parse.quote(account_id, safe='') + '/workers/scripts/regulated-infinity-web/subdomain')
          subdomain_ok = status == 200 and data.get('success') is True
          if subdomain_ok:
              result = data.get('result') or {}
              print('REGULATED_INFINITY_WEB_WORKERS_DEV_ENABLED=' + ('yes' if result.get('enabled') is True else 'no'))
              print('REGULATED_INFINITY_WEB_PREVIEW_URLS_ENABLED=' + ('yes' if result.get('previews_enabled') is True else 'no'))

          if not active:
              raise SystemExit(11)
          if not account_ok or not scripts_ok or not worker_found or not domains_ok or not domain_found:
              raise SystemExit(13)
          PY

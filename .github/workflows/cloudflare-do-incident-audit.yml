name: Cloudflare site traffic audit

on:
  push:
    branches:
      - audit/cloudflare-config-20260814

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Query site traffic and cache metrics read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN']
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          api='https://api.cloudflare.com/client/v4'
          def get(url):
              req=urllib.request.Request(url,headers=headers,method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  try: return e.code,json.load(e)
                  except Exception: return e.code,{'success':False,'errors':[{'message':'HTTP error'}]}
          print('AUDIT_MODE=read-only-sanitized')
          st,z=get(api+'/zones?name='+urllib.parse.quote('regulatedinfinity.com'))
          print('ZONE_LOOKUP_STATUS='+str(st))
          zones=(z.get('result') or []) if isinstance(z,dict) else []
          if st!=200 or not zones:
              print('ZONE_LOOKUP_ERRORS='+json.dumps((z.get('errors') or []) if isinstance(z,dict) else [],separators=(',',':'))[:1000])
              raise SystemExit(0)
          zone=str(zones[0].get('id') or '')
          if not zone: raise SystemExit(0)
          since='2026-08-14T06:30:00Z'
          until='2026-08-16T14:30:00Z'
          url=(api+'/zones/'+urllib.parse.quote(zone,safe='')+'/analytics/dashboard?'+
               urllib.parse.urlencode({'since':since,'until':until,'continuous':'false'}))
          st,data=get(url)
          print('ANALYTICS_STATUS='+str(st))
          if st!=200 or not isinstance(data,dict) or data.get('success') is not True:
              print('ANALYTICS_ERRORS='+json.dumps((data.get('errors') or []) if isinstance(data,dict) else [],separators=(',',':'))[:1000])
              raise SystemExit(0)
          result=data.get('result') or {}
          totals=result.get('totals') or {}
          requests=totals.get('requests') or {}
          pageviews=totals.get('pageviews') or {}
          uniques=totals.get('uniques') or {}
          print('SINCE='+since)
          print('UNTIL='+until)
          print('UNIQUE_VISITORS='+str(uniques.get('all')))
          print('PAGEVIEWS='+str(pageviews.get('all')))
          print('REQUESTS_ALL='+str(requests.get('all')))
          print('REQUESTS_CACHED='+str(requests.get('cached')))
          print('REQUESTS_UNCACHED='+str(requests.get('uncached')))
          print('THREATS='+str((totals.get('threats') or {}).get('all')))
          print('CACHE_RATIO=' + (str(round((requests.get('cached') or 0)*100/(requests.get('all') or 1),2))+'%'))
          # Print only aggregate country/request classifications, not IPs or raw URLs.
          print('REQUEST_IP_CLASS='+json.dumps(requests.get('ip_class') or {},sort_keys=True,separators=(',',':'))[:4000])
          print('PAGEVIEW_SEARCH_ENGINE='+json.dumps(pageviews.get('search_engine') or {},sort_keys=True,separators=(',',':'))[:4000])
          PY

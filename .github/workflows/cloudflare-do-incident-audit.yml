name: Cloudflare Durable Objects incident audit

on:
  push:
    branches:
      - audit/cloudflare-config-20260814

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Workers and Durable Objects read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          if not token or not account:
              print('REQUIRED_SECRETS_PRESENT=no')
              raise SystemExit(10)

          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          base = 'https://api.cloudflare.com/client/v4/accounts/' + urllib.parse.quote(account, safe='')

          def get(path):
              req = urllib.request.Request(base + path, headers=headers, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try:
                      data = json.load(e)
                  except Exception:
                      data = {'success': False, 'errors': [{'code': e.code, 'message': 'HTTP error'}]}
                  return e.code, data

          def safe_errors(data):
              return '; '.join(str(x.get('code', '?')) + ':' + str(x.get('message', '')) for x in (data.get('errors') or []) if isinstance(x, dict))[:500]

          print('AUDIT_MODE=read-only')

          status, data = get('/workers/scripts')
          if status != 200 or data.get('success') is not True:
              print('WORKERS_LIST_STATUS=' + str(status))
              print('WORKERS_LIST_ERROR=' + safe_errors(data))
              scripts = []
          else:
              scripts = [x for x in (data.get('result') or []) if isinstance(x, dict)]
              print('WORKER_COUNT=' + str(len(scripts)))
              for item in scripts:
                  sid = str(item.get('id') or '')
                  if sid:
                      print('WORKER=' + sid)

          status, data = get('/workers/durable_objects/namespaces?per_page=1000')
          namespaces = []
          if status != 200 or data.get('success') is not True:
              print('DO_NAMESPACE_LIST_STATUS=' + str(status))
              print('DO_NAMESPACE_LIST_ERROR=' + safe_errors(data))
          else:
              namespaces = [x for x in (data.get('result') or []) if isinstance(x, dict)]
              print('DO_NAMESPACE_COUNT=' + str(len(namespaces)))
              for ns in namespaces:
                  nsid = str(ns.get('id') or '')
                  print('DO_NAMESPACE=' + json.dumps({
                      'id': nsid,
                      'name': ns.get('name'),
                      'class': ns.get('class'),
                      'script': ns.get('script'),
                      'use_sqlite': ns.get('use_sqlite')
                  }, sort_keys=True, separators=(',', ':')))
                  if nsid:
                      st, obj = get('/workers/durable_objects/namespaces/' + urllib.parse.quote(nsid, safe='') + '/objects?limit=10')
                      if st == 200 and obj.get('success') is True:
                          info = obj.get('result_info') or {}
                          rows = obj.get('result') or []
                          total = info.get('total_count')
                          stored = sum(1 for x in rows if isinstance(x, dict) and x.get('hasStoredData') is True)
                          print('DO_OBJECT_SAMPLE=' + json.dumps({'namespace_id': nsid, 'returned': len(rows), 'sample_with_stored_data': stored, 'total_count': total}, sort_keys=True, separators=(',', ':')))
                      else:
                          print('DO_OBJECT_LIST_STATUS=' + str(st) + ' namespace=' + nsid)

          # Inspect only binding metadata and deployment timestamps; never print binding values or secrets.
          for item in scripts:
              sid = str(item.get('id') or '')
              if not sid:
                  continue
              enc = urllib.parse.quote(sid, safe='')
              st, settings = get('/workers/scripts/' + enc + '/settings')
              if st == 200 and settings.get('success') is True:
                  result = settings.get('result') or {}
                  bindings = result.get('bindings') or []
                  dos = []
                  for b in bindings:
                      if isinstance(b, dict) and b.get('type') == 'durable_object_namespace':
                          dos.append({
                              'name': b.get('name'),
                              'namespace_id': b.get('namespace_id'),
                              'class_name': b.get('class_name'),
                              'script_name': b.get('script_name')
                          })
                  if dos:
                      print('WORKER_DO_BINDINGS=' + sid + ' ' + json.dumps(dos, sort_keys=True, separators=(',', ':')))
              else:
                  print('WORKER_SETTINGS_STATUS=' + sid + ':' + str(st))

              st, deps = get('/workers/scripts/' + enc + '/deployments')
              if st == 200 and deps.get('success') is True:
                  result = deps.get('result') or {}
                  deployments = result.get('deployments') if isinstance(result, dict) else None
                  if deployments is None and isinstance(result, list):
                      deployments = result
                  deployments = deployments or []
                  for dep in deployments[:3]:
                      if isinstance(dep, dict):
                          ann = dep.get('annotations') or {}
                          print('WORKER_DEPLOYMENT=' + json.dumps({
                              'worker': sid,
                              'created_on': dep.get('created_on'),
                              'source': dep.get('source'),
                              'triggered_by': ann.get('workers/triggered_by') if isinstance(ann, dict) else None,
                              'message': ann.get('workers/message') if isinstance(ann, dict) else None
                          }, sort_keys=True, separators=(',', ':')))
              else:
                  print('WORKER_DEPLOYMENTS_STATUS=' + sid + ':' + str(st))
          PY

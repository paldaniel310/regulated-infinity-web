name: Cloudflare Durable Objects incident audit

on:
  push:
    branches:
      - audit/cloudflare-config-20260814

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Classify broker traffic read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, urllib.error, urllib.parse, urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN']; account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          root='https://api.cloudflare.com/client/v4/accounts/'+urllib.parse.quote(account,safe='')
          def post(path,body):
              req=urllib.request.Request(root+path,data=json.dumps(body).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  try: return e.code,json.load(e)
                  except Exception: return e.code,{'errors':[{'message':'HTTP error'}]}

          start=int(datetime.datetime(2026,8,15,17,0,0,tzinfo=datetime.timezone.utc).timestamp()*1000)
          end=int(datetime.datetime.now(datetime.timezone.utc).timestamp()*1000)
          timeframe={'from':start,'to':end}
          service=[{'key':'$metadata.service','operation':'eq','type':'string','value':'pulserail-github-app-broker'}]
          webhook=service+[{'key':'$metadata.trigger','operation':'eq','type':'string','value':'POST /v1/github-app/webhook'}]

          def calc(label,key,filters):
              body={'queryId':'pulserail-'+label,'timeframe':timeframe,'view':'calculations','limit':100,'dry':True,'ignoreSeries':True,
                    'parameters':{'datasets':[],'calculations':[{'operator':'count','alias':'n'}],
                                  'groupBys':[{'type':'string','value':key}], 'filters':filters,
                                  'orderBy':{'value':'n','order':'desc'}}}
              st,data=post('/workers/observability/telemetry/query',body)
              print(label.upper()+'_STATUS='+str(st))
              if st==200:
                  print(label.upper()+'='+json.dumps((data.get('result') or {}).get('calculations') or [],sort_keys=True,separators=(',',':'))[:15000])
              else:
                  print(label.upper()+'_ERROR='+json.dumps(data.get('errors') or [],separators=(',',':'))[:1000])

          print('AUDIT_MODE=read-only-sanitized')
          calc('webhook_user_agent','$workers.event.request.headers.user-agent',webhook)
          calc('webhook_event','$workers.event.request.headers.x-github-event',webhook)
          calc('webhook_verified_bot','$workers.event.request.cf.verifiedBotCategory',webhook)
          calc('broker_status','$metadata.statusCode',service)
          calc('scan_user_agent','$workers.event.request.headers.user-agent',service+[{'key':'$metadata.trigger','operation':'neq','type':'string','value':'POST /v1/github-app/webhook'}])
          PY

name: Cloudflare account-token verification

on:
  push:
    branches:
      - audit/cloudflare-config-20260814

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify account-owned Cloudflare API token safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          if not token or not account:
              print('REQUIRED_SECRETS_PRESENT=no')
              raise SystemExit(10)
          print('REQUIRED_SECRETS_PRESENT=yes')
          req = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{account}/tokens/verify',
              headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  data = json.load(r); status = r.status
          except urllib.error.HTTPError as e:
              status = e.code
              try: data = json.load(e)
              except Exception: data = {'success': False, 'errors': []}
          print('ACCOUNT_TOKEN_VERIFY_HTTP_STATUS=' + str(status))
          print('ACCOUNT_TOKEN_VERIFY_SUCCESS=' + ('yes' if data.get('success') is True else 'no'))
          result = data.get('result') or {}
          if result.get('status'):
              print('ACCOUNT_TOKEN_STATUS=' + str(result.get('status')))
          errors = data.get('errors') or []
          if errors:
              safe = []
              for item in errors[:3]:
                  if isinstance(item, dict):
                      safe.append(str(item.get('code')) + ':' + str(item.get('message')))
              if safe: print('ACCOUNT_TOKEN_ERRORS=' + ' | '.join(safe))
          if status != 200 or data.get('success') is not True or result.get('status') != 'active':
              raise SystemExit(11)
          PY

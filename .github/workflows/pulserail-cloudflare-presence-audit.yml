name: PulseRail Cloudflare presence audit

on:
  push:
    branches:
      - audit/cloudflare-config-20260814

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect PulseRail broker resources without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          if not token or not account:
              print('REQUIRED_SECRETS_PRESENT=no')
              raise SystemExit(10)
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          base = 'https://api.cloudflare.com/client/v4/accounts/' + urllib.parse.quote(account, safe='')
          def get(path):
              req = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try: data = json.load(e)
                  except Exception: data = {'success': False, 'errors': []}
                  return e.code, data

          status, data = get('/workers/scripts')
          scripts = data.get('result') or [] if status == 200 and data.get('success') is True else []
          broker = any(isinstance(x, dict) and x.get('id') == 'pulserail-github-app-broker' for x in scripts)
          print('PULSERAIL_BROKER_WORKER_PRESENT=' + ('yes' if broker else 'no'))

          status, data = get('/workers/domains')
          domains = data.get('result') or [] if status == 200 and data.get('success') is True else []
          domain = None
          for item in domains:
              if isinstance(item, dict) and item.get('hostname') == 'github.regulatedinfinity.com':
                  domain = item
                  break
          print('PULSERAIL_BROKER_CUSTOM_DOMAIN_PRESENT=' + ('yes' if domain else 'no'))
          if domain:
              print('PULSERAIL_BROKER_CUSTOM_DOMAIN_SERVICE=' + str(domain.get('service') or 'unknown'))
              print('PULSERAIL_BROKER_CUSTOM_DOMAIN_ZONE=' + str(domain.get('zone_name') or 'unknown'))

          if broker:
              status, data = get('/workers/scripts/pulserail-github-app-broker/settings')
              ok = status == 200 and data.get('success') is True
              print('PULSERAIL_BROKER_SETTINGS_ACCESSIBLE=' + ('yes' if ok else 'no'))
              if ok:
                  bindings = (data.get('result') or {}).get('bindings') or []
                  safe = []
                  for item in bindings:
                      if isinstance(item, dict):
                          name = item.get('name')
                          typ = item.get('type')
                          if isinstance(name, str) and isinstance(typ, str):
                              safe.append(name + ':' + typ)
                  print('PULSERAIL_BROKER_BINDING_NAMES=' + (','.join(sorted(safe)) if safe else 'none'))
          PY
